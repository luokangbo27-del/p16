  const szVal = Array.isArray(c.szSel) ? (c.szSel[0]||'') : (c.szSel||'');
  document.getElementById('oeSel').value = oeVal;
  document.getElementById('szSel').value = szVal;
  const set=(id,v)=>document.getElementById(id).value=v;
  set('s1w',c.s1.split(',')[0]);set('s1q',c.s1.split(',')[1]);set('s1b',c.s1.split(',')[2]);set('s1s',c.s1.split(',')[3]);
  set('s2w',c.s2.split(',')[0]);set('s2q',c.s2.split(',')[1]);set('s2b',c.s2.split(',')[2]);set('s2s',c.s2.split(',')[3]);
  set('s3w',c.s3.split(',')[0]);set('s3q',c.s3.split(',')[1]);set('s3b',c.s3.split(',')[2]);set('s3s',c.s3.split(',')[3]);
}
/* ============ 引擎 ============ */
const dig=(s,p)=>s.charCodeAt(p)-48;
const sum4=s=>dig(s,0)+dig(s,1)+dig(s,2)+dig(s,3);
const oeP=s=>[0,1,2,3].map(p=>dig(s,p)%2===1?'单':'双').join('');
const szP=s=>[0,1,2,3].map(p=>dig(s,p)>=5?'大':'小').join('');
const struct=s=>{const m={};for(const c of s)m[c]=(m[c]||0)+1;const v=Object.values(m).sort((a,b)=>b-a);return v[0]===4?'quad':v[0]===3?'triple':(v[0]===2&&v[1]===2)?'twopair':v[0]===2?'pair':'none';};
const is3=(a,b,c)=>(b===a+1&&c===a+2)||(b===a-1&&c===a-2);
const is4=(a,b,c,d)=>(b===a+1&&c===a+2&&d===a+3)||(b===a-1&&c===a-2&&d===a-3);
const hasPair=(s,pr)=>s.includes(pr[0])&&s.includes(pr[1]);
function stepsOf(cfg, set, t){
  const hlen=Math.min(t,cfg.histWin);
  const hs=new Set(hist.slice(t-hlen,t).map(x=>x.n));
  const arr=cfg.sets[set].split(',');
  const P2 = t>=2 ? hist[t-2].n : null;
  const steps=[];
  steps.push(['固定码第'+(set+1)+'套', s=>arr.every((d,p)=>d.includes(s[p]))]);
  steps.push(['历史'+hlen+'期已开', s=>!hs.has(s)]);
  steps.push(['和值'+cfg.sumMin+'-'+cfg.sumMax, s=>{const x=sum4(s);return x>=cfg.sumMin&&x<=cfg.sumMax;}]);
  steps.push(['排除四重', s=>struct(s)!=='quad']);
  steps.push(['排除三重', s=>struct(s)!=='triple']);
  steps.push(['排除双对子', s=>struct(s)!=='twopair']);
  for(const pr of cfg.pairs) steps.push(['对数排除'+pr.join(''), s=>!hasPair(s,pr)]);
  if(cfg.oeSel.length) steps.push(['单双排'+cfg.oeSel.join('/'), s=>!cfg.oeSel.includes(oeP(s))]);
  if(cfg.oeOn && P2 && OE13.includes(oeP(P2))) steps.push(['单双隔期排'+oeP(P2), s=>oeP(s)!==oeP(P2)]);
  if(cfg.szSel.length) steps.push(['大小排'+cfg.szSel.join('/'), s=>!cfg.szSel.includes(szP(s))]);
  if(cfg.szOn && P2 && SZ8.includes(szP(P2))) steps.push(['大小隔期排'+szP(P2), s=>szP(s)!==szP(P2)]);
  if(cfg.tpOn){
    const last10 = hist.slice(Math.max(0,t-10), t).map(x=>x.n);
    steps.push(['三位同位排上10期', s=>{
      for(const d of last10){
        let m=0;
        for(let p=0;p<4;p++){ if(s[p]===d[p]) m++; if(m>=3) return false; }
      }
      return true;
    }]);
  }
  if(cfg.s4On) steps.push(['排除4顺子', s=>!is4(dig(s,0),dig(s,1),dig(s,2),dig(s,3))]);
  if(cfg.s3On) steps.push(['排除3顺子', s=>!(is3(dig(s,0),dig(s,1),dig(s,2))||is3(dig(s,1),dig(s,2),dig(s,3)))]);
  return steps;
}
function genPool(cfg, set, t){
  t = t===undefined ? hist.length : t;
  const steps=stepsOf(cfg,set,t);
  let cur=[]; for(let n=0;n<10000;n++) cur.push(String(n).padStart(4,'0'));
  const funnel=[];
  for(const [name,fn] of steps){
    const before=cur.length;
    cur=cur.filter(fn);
    funnel.push([name,before,before-cur.length,cur.length]);
  }
  return {pool:cur, funnel};
}
function whyMiss(s, cfg, set, t){
  for(const [name,fn] of stepsOf(cfg,set,t)){ if(!fn(s)) return name; }
  return null;
}
/* ============ 界面 ============ */
let cache=null; // [{pool,funnel}]
let curTab=0;
function refreshInfo(){
  document.getElementById('histCnt').textContent=hist.length+' 期';
  document.getElementById('latest').textContent=hist.length?('期'+hist[hist.length-1].p+' 开'+hist[hist.length-1].n):'-';
  document.getElementById('p2').textContent=hist.length>=2?('期'+hist[hist.length-2].p+' 开'+hist[hist.length-2].n):'-';
}
function recalc(){
  const cfg=getCfg();
  cache=[];
  const tabs=document.getElementById('tabs');
  tabs.innerHTML='';
  for(let i=0;i<3;i++){
    cache.push(genPool(cfg,i));
    const b=document.createElement('button');
    b.textContent='第'+(i+1)+'套('+cache[i].pool.length+'组)';
    b.onclick=()=>{curTab=i;renderTabs();showSet(i);};
    tabs.appendChild(b);
  }
  if(curTab>2)curTab=0;
  renderTabs();
  showSet(curTab);
}
function renderTabs(){
  const tabs=document.getElementById('tabs').children;
  for(let i=0;i<tabs.length;i++) tabs[i].className = (i===curTab)?'on':'';
}
function showSet(i){
  if(!cache||!cache[i])return;
  const {pool,funnel}=cache[i];
  const cfg=getCfg();
  const P2=hist.length>=2?hist[hist.length-2]:null;
  let h='<p class="note">第'+(i+1)+'套固定码: '+
    ['万','千','百','十'].map((x,p)=>x+'['+cfg.sets[i].split(',')[p]+']').join(' ')+'</p>';
  if(P2){
    const o=oeP(P2.n), z=szP(P2.n);
    h+='<p class="note">上二期=期'+P2.p+'开'+P2.n+' → 单双'+o+(OE13.includes(o)?'(13名单→排除)':'(不排)')+' / 大小'+z+(SZ8.includes(z)?'(8名单→排除)':'(不排)')+'</p>';
  }
  h+='<table><tr><th>步骤</th><th>前</th><th>排除</th><th>剩</th></tr>';
  for(const f of funnel) h+='<tr><td>'+f[0]+'</td><td class="num">'+f[1]+'</td><td class="num">'+f[2]+'</td><td class="num">'+f[3]+'</td></tr>';
  h+='</table>';
  h+='<p>最终剩余: <b class="big">'+pool.length+'</b> 组（重复0 违规0）</p>';
  h+='<div class="row"><button onclick="copyPool('+i+')">复制第'+(i+1)+'套全部号码</button><button class="ghost" onclick="dlPool('+i+')">下载txt</button></div>';
  h+='<div class="poolbox" id="poolbox'+i+'">'+pool.join(' ')+'</div>';
  document.getElementById('setOut').innerHTML=h;
}
function copyPool(i){
  const t=cache[i].pool.join(' ');
  const done=()=>alert('已复制 '+cache[i].pool.length+' 组');
  if(navigator.clipboard&&navigator.clipboard.writeText){ navigator.clipboard.writeText(t).then(done,done); }
  else{
    const ta=document.createElement('textarea'); ta.value=t; document.body.appendChild(ta); ta.select();
    try{document.execCommand('copy');}catch(e){}
    document.body.removeChild(ta); done();
  }
}
function dlPool(i){
  const a=document.createElement('a');
  a.href=URL.createObjectURL(new Blob([cache[i].pool.join('\n')],{type:'text/plain'}));
  a.download='p5_set'+(i+1)+'_candidates.txt';
  a.click();
}
async function addDraw(){
  const status = document.getElementById('hitMsg');
  const v=document.getElementById('newNum').value.replace(/\D/g,'');
  if(v.length<4){ alert('请输入4位或5位开奖号'); return; }
  let n=v.slice(0,4).padStart(4,'0');
  const lastN = hist.length ? hist[hist.length-1].n : '';
  if (n === lastN) { status.innerHTML='<span class="warn">⚠️ 与上一期开奖号相同（疑似重复录入），已忽略。最新仍是 期'+hist[hist.length-1].p+' 开'+lastN+'</span>'; document.getElementById('newNum').value=''; return; }
  const lastP=hist.length? +hist[hist.length-1].p : 0;
  const newP = String(lastP+1);
  let note='';
  try {
    const official = await fetchOfficial(1);
    if (official.has(newP)) {
      const on = official.get(newP).slice(0,4);
      if (on !== n) { note = '<br><span class="warn">⚠️ 你输入的 '+n+' 与官网 期'+newP+' 开'+on+' 不一致，已按官网校正。</span>'; n = on; }
      else note = '<br><span class="note">✅ 已与官网核对一致。</span>';
    } else {
      document.getElementById('newNum').value='';
      status.innerHTML='<span class="warn">⛔ 官网还没有 期'+newP+' 的开奖记录，已拒绝添加（未开奖的号码不能录入）。请稍后点「🔄 同步官网最新」或重新输入。</span>';
      return;
    }
  } catch(e) {
    document.getElementById('newNum').value='';
    status.innerHTML='<span class="warn">⛔ 官网核对失败（'+e.message+'），为避免错误记录，本次未添加。请联网后再试。</span>';
    return;
  }
  let msg='<b>命中检查(开奖前冻结池):</b> ';
  if(cache){
    for(let i=0;i<3;i++) msg+='第'+(i+1)+'套 '+(cache[i].pool.includes(n)?'<span class="ok">命中✓</span> ':'<span class="bad">未中✗</span> ');
    if(!cache[0].pool.includes(n)&&!cache[1].pool.includes(n)&&!cache[2].pool.includes(n)){
      msg+='<br><span class="note">三套全未命中。</span>';
    }
  } else { msg='<span class="warn">请先点"重新计算"生成冻结池再输入开奖号</span>'; }
  status.innerHTML=msg+note;
  hist.push({p:newP, n});
  saveExtra();
  refreshInfo();
  recalc();
  document.getElementById('newNum').value='';
}
function shortWhy(w){
  const m={
    '历史1000期已开':'历史',
    '结构(全同/三重/双对)':'结构',
    '结构':'结构',
    '和值8-29':'和值',
    '单双隔期':'单双',
    '大小隔期':'大小',
    '4顺子':'4顺',
    '3顺子':'3顺'
  };
  if(m[w]) return m[w];
  if(w.startsWith('固定码第')) return '码'+w.replace(/[^0-9]/g,'');
  if(w.startsWith('对数排除')) return '对数'+w.replace(/[^0-9]/g,'');
  return w;
}
function runBacktest(){
  const N=+document.getElementById('btN').value||20;
  if(N>500){alert('回测最多500期');return;}
  const cfg=getCfg();
  const out=document.getElementById('btOut');
  document.getElementById('btNote').textContent='计算中（每个回测期都要重算一次三套池，请稍候）...';
  setTimeout(()=>{
    const saved=hist;
    const t0=Math.max(hist.length-N,2);
    const n=hist.length-t0;
    const rows=[];
    const hits=[0,0,0], avg=[0,0,0];
    const whyCnt=[{}, {}, {}];
    for(let t=t0;t<hist.length;t++){
      const period=saved[t].p, actual=saved[t].n;
      hist=saved.slice(0,t);
      const cells=[];
      for(let i=0;i<3;i++){
        const {pool}=genPool(cfg,i,t);
        avg[i]+=pool.length;
        if(pool.includes(actual)){ hits[i]++; cells.push('<span class="ok">中√</span>'); }
        else {
          const why=whyMiss(actual,cfg,i,t)||'未知';
          whyCnt[i][why]=(whyCnt[i][why]||0)+1;
          cells.push('<span class="bad">✗</span> <span class="note" title="'+why+'">'+shortWhy(why)+'</span>');
        }
      }
      hist=saved;
      rows.push('<tr><td class="num">'+period+'</td><td class="num">'+actual+'</td>'+cells.map(c=>'<td>'+c+'</td>').join('')+'</tr>');
    }
    let h='<div class="note" style="margin:8px 0">近'+n+'期逐期明细 · 每期只用开奖前数据计算 · 原因 = 开奖号被哪条规则排除（第一条不满足的规则）</div>';
    h+='<table><tr><th>期号</th><th>开奖(前四位)</th><th>第1套</th><th>第2套</th><th>第3套</th></tr>'+rows.join('')+'</table>';
    h+='<table style="margin-top:12px"><tr><th>套别</th><th>命中</th><th>命中率</th><th>平均候选</th><th>未命中原因统计</th></tr>';
    for(let i=0;i<3;i++){
      const why=Object.entries(whyCnt[i]).sort((a,b)=>b[1]-a[1]).map(([k,v])=>k+'×'+v).join('、')||'—';
      h+='<tr><td>第'+(i+1)+'套</td><td class="num">'+hits[i]+'/'+n+'</td><td class="num">'+(n?(hits[i]/n*100).toFixed(1):0)+'%</td><td class="num">'+(n?(avg[i]/n).toFixed(0):0)+'</td><td class="note">'+why+'</td></tr>';
    }
    h+='</table>';
    h+='<div class="note" style="margin-top:6px">图例：码1/码2/码3=固定码第1/2/3套 · 历史=历史近1000期已开 · 结构=排全同/三重/双对 · 和值=和值8-29 · 单双/大小=隔期名单 · 4顺/3顺=顺子 · 对数=两数字同时出现</div>';
    out.innerHTML=h;
    document.getElementById('btNote').textContent='完成（'+n+'期）';
  },60);
}
/* ============ 官网数据拉取 ============ */
const OFF_API = 'https://webapi.sporttery.cn/gateway/lottery/getHistoryPageListV1.qry?gameNo=350133&provinceId=0&pageSize=100&isVerify=1&pageNo=';
let _offCache = null, _offCacheAt = 0;
async function fetchOfficial(maxPages){
  maxPages = maxPages || 3;
  if (_offCache && Date.now() - _offCacheAt < 60000) return _offCache;
  const baseArr = BASE_DATA.split(',').filter(Boolean);
  const baseLastP = baseArr.length ? Number(baseArr[baseArr.length-1].slice(0, baseArr[baseArr.length-1].indexOf(':'))) : 0;
  const official = new Map();
  let page = 1, useProxy = false;
  while (page <= maxPages) {
    const u = OFF_API + page + '&_=' + Date.now();
    let j = null;
    if (!useProxy) {
      try {
        const ctrl = new AbortController(); const t = setTimeout(()=>ctrl.abort(), 8000);
        const r = await fetch(u, {cache:'no-store', signal: ctrl.signal});
        clearTimeout(t);
        if (!r.ok) throw new Error('HTTP ' + r.status);
        j = await r.json();
      } catch(e) { useProxy = true; }
    }
    if (useProxy) {
      const pr = await fetch('https://api.allorigins.win/raw?url=' + encodeURIComponent(u), {cache:'no-store'});
      if (!pr.ok) throw new Error('HTTP ' + pr.status + '（代理）');
      j = await pr.json();
    }
    const list = (j && j.value && j.value.list) || [];
    if (!list.length) break;
    for (const it of list) {
      const n = String(it.lotteryDrawResult).replace(/\D/g,'');
      if (n.length >= 5) official.set(String(it.lotteryDrawNum), n);
    }
    if (Number(list[list.length-1].lotteryDrawNum) <= baseLastP) break;
    page++;
  }
  if (!official.size) throw new Error('接口返回为空');
  _offCache = official; _offCacheAt = Date.now();
  return official;
}

/* ============ 官网同步 ============ */
async function syncOfficial(showMsg){
  const status = document.getElementById('hitMsg');
  try {
    const official = await fetchOfficial(10);
    const baseArr = BASE_DATA.split(',').filter(Boolean);
    const merged = new Map();
    for (const it of baseArr) { const k=it.indexOf(':'); merged.set(it.slice(0,k), it.slice(k+1)); }
    let fixed = 0;
    for (const [p, full] of official) {
      const v = full.slice(0,4);
      if (merged.has(p) && merged.get(p) !== v) fixed++;
      merged.set(p, v);
    }
    const saved = localStorage.getItem('p5_extra_draws');
    const extras = saved ? JSON.parse(saved) : [];
    const offLastP = Math.max(...[...official.keys()].map(Number));
    const arr = [...merged.entries()].map(([p,n])=>({p,n})).sort((a,b)=>Number(a.p)-Number(b.p));
    let prevN = arr.length ? arr[arr.length-1].n : '';
    let dropped = 0;
    for (const ex of extras.sort((a,b)=>Number(a.p)-Number(b.p))) {
      if (!official.has(String(ex.p))) { dropped++; continue; }  // 官网没有这期 → 丢弃（未经核对）
      const officialN = official.get(String(ex.p)).slice(0,4);
      if (ex.n !== officialN) { fixed++; }                        // 与官网不符 → 以官网为准
      if (merged.has(String(ex.p))) continue;
      arr.push({p:String(ex.p), n:officialN});
      prevN = officialN;
    }
    arr.sort((a,b)=>Number(a.p)-Number(b.p));
    const seen=new Set(); const out=[];
    for(const it of arr){ if(seen.has(it.p)) continue; seen.add(it.p); out.push(it); }
    hist = out;
    saveExtra(); refreshInfo(); recalc();
    localStorage.setItem('p5_lastcheck', String(Date.now()));
    const last = hist[hist.length-1], prev = hist[hist.length-2];
    if (showMsg) {
      let s2 = '✅ 已对照官网：最新 期'+last.p+' 开'+last.n+' · 上期 '+prev.p+' 开'+prev.n+' · 共 '+hist.length+' 期';
      if (fixed) s2 += ' · 校正 '+fixed+' 期';
      if (dropped) s2 += ' · 清理重复 '+dropped+' 条';
      status.innerHTML = '<span class="ok">'+s2+'</span>';
    }
  } catch(e) {
    if (showMsg) status.innerHTML = '<span class="warn">⚠️ 官网核对失败（'+e.message+'），历史未校验；联网后可再点「🔄 同步官网最新」。</span>';
  }
}

function cleanLocal(){
  localStorage.removeItem('p5_extra_draws');
  loadHist(); refreshInfo(); recalc();
  syncOfficial(true);
}

/* ============ 初始化 ============ */
loadCfg();
loadHist();
refreshInfo();
recalc();
syncOfficial(false);
